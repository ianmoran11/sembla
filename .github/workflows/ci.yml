name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect path-filtered work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      npe: ${{ steps.filter.outputs.npe }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect NPE changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            npe:
              - 'calibration/**'
              - 'calibration/npe/requirements.txt'
              - 'calibration/npe/requirements-ci.lock'
              - 'docs/prds-npe-path/**'
              - 'scripts/check-npe-smoke.sh'
              - 'scripts/check-npe-lock.sh'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain and restore Cargo cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Parse workflow YAML
        run: ruby scripts/check-workflow-yaml.rb
      - name: Check package metadata and local Markdown links
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -B scripts/check-markdown-links.py
          python3 -B scripts/check-cargo-metadata.py
      - name: Rust formatting, lint, tests, and dependency policy
        run: ./scripts/check-rust.sh
      - name: Lean proof hygiene
        run: bash frontend/scripts/check-proofs.sh

  determinism:
    name: Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain and restore Cargo cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Double-run byte comparisons
        run: ./scripts/check-determinism.sh

  lean:
    name: Lean frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain and restore Cargo cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Install pinned Lean toolchain and restore Lake cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: frontend
          auto-config: false
      - name: Build and test the Lean frontend
        run: bash frontend/scripts/check-parity.sh

  npe-smoke:
    name: NPE smoke
    needs: changes
    if: needs.changes.outputs.npe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up pinned Python with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: calibration/npe/requirements-ci.lock
      - name: Install hashed NPE dependency lock
        run: calibration/npe/install-requirements-ci.sh
      - name: Run tiny training and refusal smoke tests
        run: ./scripts/check-npe-smoke.sh
